<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T-Shirt World — Admin</title><link rel="stylesheet" href="admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body>
<header class="topbar"><div class="brand"><span class="logo">TW</span><div><b>T-Shirt World</b><small>Admin Panel</small></div></div><a href="index.html">← Store</a></header>
<main class="wrap">
<section id="loginCard" class="card login"><h1>Admin Login</h1><p>শুধু অনুমোদিত admin account দিয়ে ঢুকুন।</p><form id="loginForm"><input id="email" type="email" required placeholder="Admin email"><input id="password" type="password" required placeholder="Password"><button>Login</button></form><small id="setupMsg"></small></section>
<section id="app" class="hidden">
<div class="headrow"><div><p>ADMIN</p><h1>Product Management</h1></div><button id="logout" class="ghost">Logout</button></div>
<div class="grid"><section class="card"><h2 id="formTitle">নতুন Product</h2><form id="productForm"><input type="hidden" id="id"><label>নাম<input id="name" required></label><div class="two"><label>Price<input id="price" type="number" min="0" required></label><label>Old price<input id="oldPrice" type="number" min="0"></label></div><div class="two"><label>Category<input id="category" placeholder="Custom / Puja / Group"></label><label>Sizes<input id="sizes" value="S, M, L, XL, XXL"></label></div><label>Description<textarea id="description"></textarea></label><label>Image URL<input id="image" type="url" placeholder="https://..."></label><label class="check"><input id="featured" type="checkbox"> Featured</label><label class="check"><input id="active" type="checkbox" checked> Visible in store</label><button id="save" class="primary">+ Add Product</button><button type="button" id="cancel" class="ghost hidden">Cancel edit</button></form></section>
<section class="card"><div class="headrow"><h2>Products</h2><input id="search" placeholder="Search..."></div><div id="list"></div></section></div>
<section class="card orders"><div class="headrow"><h2>Recent Orders</h2><button id="refreshOrders" class="ghost">Refresh</button></div><div id="ordersList">Loading...</div></section>
</section></main><div id="toast"></div><script src="admin.js"></script></body></html>
